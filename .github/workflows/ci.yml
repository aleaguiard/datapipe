name: CI

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  ci:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        env:
          AWS_REGION: eu-west-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          ENDPOINT_OVERRIDE: http://localhost:4566
          AWS_ENDPOINT_URL: http://localhost:4566
          JOBS_TABLE: datapipe-jobs
          ROWS_TABLE: datapipe-rows
          UPLOADS_BUCKET: datapipe-uploads-local
          PROCESSING_QUEUE_URL: http://localhost:4566/000000000000/datapipe-processing
        run: npm run test:integration
